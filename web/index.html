<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NightAuth Web Example</title></head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="login-form">
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <label>Authenticator code <input name="totpCode" inputmode="numeric" autocomplete="one-time-code"></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
